app = "cowork-mail"
primary_region = "sjc"

[build]

[env]
  COWORK_MAIL_DB = "/data/cowork-mail.db"
  COWORK_MAIL_PORT = "3141"

[mounts]
  source = "cowork_mail_data"
  destination = "/data"

[http_service]
  internal_port = 3141
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
